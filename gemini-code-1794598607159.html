<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دورة إحتراف المونتاج وصناعة المحتوى | ZY SERVICE</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-deep: #F8F9FA;
            --bg-card: #FFFFFF;
            --accent-yellow: #FFD600;
            --accent-yellow-dark: #C9A227;
            --text-main: #1A1A1A;
            --text-muted: #666666;
            --border-glass: rgba(201, 162, 39, 0.25);
            --shadow: 0 15px 35px rgba(0, 0, 0, 0.06);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(255, 214, 0, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 90% 90%, rgba(255, 214, 0, 0.08) 0%, transparent 50%);
        }

        .wrapper {
            width: 100%;
            max-width: 680px;
            margin: 0 auto;
            padding: 20px 15px 60px 15px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .brand-header {
            text-align: center;
            padding: 25px 0 10px 0;
        }

        .brand-logo {
            font-size: 34px;
            font-weight: 900;
            color: #1A1A1A;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .brand-logo span {
            color: var(--accent-yellow-dark);
            background: #1A1A1A;
            padding: 2px 10px;
            border-radius: 8px;
            margin-right: 5px;
        }

        .brand-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .glass-card {
            background: var(--bg-card);
            border: 2px solid var(--border-glass);
            border-radius: 28px;
            padding: 35px 25px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #1A1A1A, var(--accent-yellow), var(--accent-yellow-dark));
        }

        .alert-banner {
            background: rgba(255, 75, 75, 0.08);
            border: 1px solid rgba(255, 75, 75, 0.25);
            color: #d93838;
            padding: 14px 18px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 800;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(255, 75, 75, 0.05);
        }

        .main-title {
            font-size: 26px;
            font-weight: 900;
            color: #1A1A1A;
            text-align: center;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .main-title span {
            background: var(--accent-yellow);
            color: #1A1A1A;
            padding: 2px 8px;
            border-radius: 6px;
        }

        .price-section {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin: 20px 0 30px 0;
        }

        .price-tag {
            background: #1A1A1A;
            color: var(--accent-yellow);
            font-size: 26px;
            font-weight: 900;
            padding: 12px 35px;
            border-radius: 50px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            border: 2px solid var(--accent-yellow);
        }

        .sessions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        .session-box {
            background: #F8F9FA;
            border: 1px solid #E5E7EB;
            padding: 18px;
            border-radius: 18px;
            text-align: center;
            transition: transform 0.2s;
        }

            color: #1A1A1A;
            font-size: 24px;
